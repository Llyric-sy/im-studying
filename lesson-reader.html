<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson · im studying</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="learn-static.css?v=2">
<style>
body{background:#0b1020}.reader-shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:20px 0 42px}.reader-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.reader-brand{font-weight:800;color:#f4f6fb}.reader-back{color:#93a5c8;text-decoration:none;border:1px solid rgba(255,255,255,.1);padding:9px 12px;border-radius:10px}.loading{padding:30px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:#12182a;color:#93a5c8}.reader-shell .lesson{margin-top:0}.reader-shell .backlink{display:none}
</style>
</head>
<body><main class="reader-shell"><header class="reader-top"><div class="reader-brand">im studying · lesson</div><a id="backLink" class="reader-back" href="lessons.html">← lessons</a></header><div id="reader" class="loading">loading lesson…</div></main>
<script>
(async function(){
  const params=new URLSearchParams(location.search);const id=params.get('id');const root=document.getElementById('reader');
  const unit=id?.startsWith('acct')?'acct':id?.startsWith('ecom')?'ecom':'';document.getElementById('backLink').href=`lessons.html#${unit||'acct'}`;
  if(!id){root.textContent='No lesson was selected.';return;}
  try{
    const html=await fetch('learn.html?v=2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('fetch');return r.text()});
    const doc=new DOMParser().parseFromString(html,'text/html');const article=doc.getElementById(id);
    if(!article){root.innerHTML='<b>Lesson not found.</b><br><br>Go back to Lessons and choose another topic.';return;}
    root.className='';root.replaceChildren(article.cloneNode(true));document.title=(article.querySelector('h2')?.textContent||'Lesson')+' · im studying';
  }catch(e){root.innerHTML='<b>Could not load the lesson reader.</b><br><br><a style="color:#a7a5ff" href="learn.html#'+encodeURIComponent(id)+'">Open the fallback lesson page</a>';}
})();
</script></body></html>
